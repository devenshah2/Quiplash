<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    if (location.protocol === 'http:' && ['devenshah.com','www.devenshah.com','devenshah2.github.io'].includes(location.hostname)) {
      location.replace('https://' + location.host + location.pathname + location.search + location.hash);
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1725">
  <meta name="description" content="Host a comedy party game for 3–8 friends. Answer with GIFs, pictures, or text and vote for the funniest punchline.">
  <title>Punchline! · Comedy party game</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/fonts/barlow-black.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./editor.css">
  <script defer src="./vendor/qr.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <div class="brand"><span class="brand-tile" data-icon="mic"></span><span>PUNCHLINE!</span></div>
    <nav aria-label="Game controls">
      <button class="utility rules-open"><span data-icon="help"></span><span>How to play</span></button>
      <button class="utility sound-open" aria-label="Sound settings" title="Sound settings"><span data-icon="speaker"></span></button>
    </nav>
  </div></header>
  <main id="screen"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="dialog-inner">
    <button class="close-modal" aria-label="Close dialog"><span data-icon="close"></span></button>
    <div id="modal-body"></div>
  </div></dialog>
  <noscript>Turn on JavaScript to host or join a game.</noscript>
</body>
</html>
